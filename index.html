<!doctype html>

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Compatibility shim for browser extensions that attempt to reassign window.fetch
      (function() {
        try {
          var originalFetch = window.fetch ? window.fetch.bind(window) : null;
          var currentFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return currentFetch;
            },
            set: function(newFetch) {
              currentFetch = newFetch;
            }
          });
        } catch (e) {
          // ignore
        }

        // Prevent browser extension script errors from crashing or halting the app
        window.addEventListener('error', function(event) {
          if (event && event.filename && (event.filename.indexOf('chrome-extension://') !== -1 || event.filename.indexOf('moz-extension://') !== -1 || event.filename.indexOf('safari-extension://') !== -1)) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>
    <title>WASEET - وسيط الاستشارات</title>
